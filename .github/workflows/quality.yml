name: FRESTA quality gates
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  static-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check assets/index-fresta-browser-v035.js
          node --check assets/stair-physics-v034.mjs
          node --check tests/browser-smoke.cjs
      - name: Staircase and document regression tests
        run: node --test tests/*.test.cjs
