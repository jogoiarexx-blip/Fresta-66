name: FRESTA quality gates
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  static-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check production JavaScript and test syntax
        run: |
          node --check tests/v070-release.test.cjs
          node --check tests/browser-smoke.cjs
          node --check assets/index-C-oLyjfl.js
          node --check assets/three-DtP2iNHE.js
      - name: FRESTA v0.7.0 release regression tests
        run: node --test tests/v070-release.test.cjs
